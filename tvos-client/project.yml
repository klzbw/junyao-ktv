name: JunyaoKtvTV
options:
  bundleIdPrefix: com.junyao
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  projectFormat: Xcode 14.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"
    SDKROOT: appletvos
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSAppTransportSecurity:
      NSAllowsArbitraryLoads: YES
targets:
  JunyaoKtvTV:
    type: application
    platform: tvOS
    sources:
      - path: JunyaoKtvTV
    postBuildScripts:
      - name: Set Chinese Display Name
        script: |
          PLIST="${CODESIGNING_FOLDER_PATH:-$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME}/Info.plist"
          DISPLAY_NAME=$(printf '\xe5\xa2\xa8\xe5\xa2\xa8\xe7\x88\xb1K\xe6\xad\x8c')
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $DISPLAY_NAME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleName" "$PLIST" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string $DISPLAY_NAME" "$PLIST"
          echo "CFBundleName=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST" )"
          echo "CFBundleDisplayName=$( /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST" )"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyao.ktv.tv
        PRODUCT_NAME: "JunyaoKtvTV"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
