name: JunyaoKtvTV
options:
  bundleIdPrefix: com.junyao
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  projectFormat: Xcode 14.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "3"
    SDKROOT: appletvos
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSAppTransportSecurity:
      NSAllowsArbitraryLoads: YES
targets:
  JunyaoKtvTV:
    type: application
    platform: tvOS
    sources:
      - path: JunyaoKtvTV
    resources:
      - path: App Icon.imagestack
    postBuildScripts:
      - name: Ensure App Icon imagestack
        script: |
          APP_DIR="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app"
          ICON_DIR="$APP_DIR/App Icon.imagestack"
          SRC_ICON="$SRCROOT/App Icon.imagestack"
          echo "=== App bundle root ==="
          ls -la "$APP_DIR" | head -30
          echo "=== imagestack check ==="
          if [ -d "$ICON_DIR" ]; then
            echo "FOUND: $ICON_DIR"
            ls -la "$ICON_DIR"
          else
            echo "NOT FOUND, copying from $SRC_ICON"
            mkdir -p "$ICON_DIR"
            cp "$SRC_ICON/"*.png "$ICON_DIR/" 2>/dev/null
            cp "$SRC_ICON/Contents.json" "$ICON_DIR/" 2>/dev/null
            ls -la "$ICON_DIR"
          fi
          echo "=== Info.plist CFBundleIcons ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons" "$APP_DIR/Info.plist" 2>/dev/null || echo "(not found)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junyao.ktv.tv
        PRODUCT_NAME: "JunyaoKtvTV"
        INFOPLIST_KEY_CFBundleDisplayName: "墨墨爱K歌"
        INFOPLIST_KEY_CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: "App Icon"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
